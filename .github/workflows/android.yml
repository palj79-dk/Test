name: Build Android APK

# Builds an installable (sideloadable) debug APK of the latest fallengrid-v*.html.
# Runs on every push that touches the game or the wrapper, and can be run on demand.
on:
  push:
    branches: [ "claude/tower-defense-graphics-l7p9mn" ]
    paths:
      - "app/**"
      - "fallengrid-v*.html"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor
        run: npm install

      - name: Bundle the latest game build as index.html
        run: |
          # `sort -V` only picks the right file while every build follows the SAME dotted scheme.
          # The frozen V2.5 build used to be named fallengrid-v25.html, which version-sorts as 25 and
          # beat v6.38 — the APK would silently have shipped a 2D build from months earlier. It is
          # now fallengrid-v2.5.html. The guard below makes that class of mistake fail loudly instead
          # of shipping: the file the workflow picked must SELF-REPORT the version in its own name.
          latest=$(ls -1 ../fallengrid-v*.html | sort -V | tail -1)
          fver=$(echo "$latest" | sed -E 's#.*/fallengrid-v([0-9.]+)\.html#\1#')
          echo "Bundling $latest (expects to self-report V$fver)"
          if ! grep -q "V${fver} ·" "$latest"; then
            echo "::error::$latest does not carry the label 'V$fver' — wrong file picked, or the in-game version label was not bumped."
            exit 1
          fi
          mkdir -p www
          cp "$latest" www/index.html

      - name: Add Android platform
        run: npx cap add android

      # V6.32 (C3): the Android project is generated here, so AndroidManifest.xml is not checked in
      # and has to be patched after every `cap add`. Two things matter for landscape support:
      #  1. screenOrientation=fullSensor  - allow BOTH orientations (never lock to portrait).
      #  2. configChanges must include orientation|screenSize - without them Android destroys and
      #     recreates the activity on rotation, the WebView reloads, and the player LOSES THE RUN.
      - name: Allow both orientations (patch generated manifest)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          m = re.search(r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>', s, re.S)
          if not m:
              print("FATAL: MainActivity not found in", p); sys.exit(1)
          tag = m.group(0)
          new = tag
          if 'android:screenOrientation' in new:
              new = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="fullSensor"', new)
          else:
              new = new[:-1].rstrip() + '\n            android:screenOrientation="fullSensor">'
          cm = re.search(r'android:configChanges="([^"]*)"', new)
          need = ["orientation", "screenSize", "screenLayout", "keyboardHidden"]
          if cm:
              have = cm.group(1).split("|")
              merged = have + [k for k in need if k not in have]
              new = new.replace(cm.group(0), 'android:configChanges="%s"' % "|".join(merged))
          else:
              new = new[:-1].rstrip() + '\n            android:configChanges="%s">' % "|".join(need)
          s = s.replace(tag, new)
          open(p, "w", encoding="utf-8").write(s)
          print("patched MainActivity:\n" + new)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Use the committed stable debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK with the game version
        run: |
          ver=$(ls -1 ../fallengrid-v*.html | sort -V | tail -1 | sed -E 's#.*/fallengrid-(v[0-9.]+)\.html#\1#')
          cp android/app/build/outputs/apk/debug/app-debug.apk "fallengrid-${ver}.apk"
          echo "Built fallengrid-${ver}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fallengrid-apk
          path: app/fallengrid-*.apk
          if-no-files-found: error
